# Example GitHub Actions workflow for notifying Flarum about new releases
#
# To use this workflow:
# 1. Copy this file and rename it to `.github/workflows/flarum-release-notification.yml`
# 2. Add the following secret to your repository:
#    - FLARUM_API_TOKEN: Your Flarum API token
# 3. Ensure your composer.json has the "support.forum" field set to your discussion URL
#    Example: "support": { "forum": "https://discuss.flarum.org/d/12345" }
#
# See the README.md for detailed setup instructions

name: Notify Flarum on Release

on:
  release:
    types: [published]

jobs:
  notify-flarum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flarum discussion info from composer.json
        id: flarum-info
        run: |
          # Extract forum URL from composer.json
          FORUM_URL=$(jq -r '.support.forum // empty' composer.json)

          if [ -z "$FORUM_URL" ]; then
            echo "Error: No support.forum field found in composer.json"
            echo "Please add: \"support\": { \"forum\": \"https://discuss.flarum.org/d/12345\" }"
            exit 1
          fi

          # Extract discussion ID from URL (handles both /d/123 and /d/123-slug formats)
          DISCUSSION_ID=$(echo "$FORUM_URL" | grep -oP '/d/\K\d+' || echo "")

          if [ -z "$DISCUSSION_ID" ]; then
            echo "Error: Could not extract discussion ID from forum URL: $FORUM_URL"
            echo "Expected format: https://discuss.flarum.org/d/12345 or https://discuss.flarum.org/d/12345-slug"
            exit 1
          fi

          # Extract base URL (everything before /d/)
          FLARUM_URL=$(echo "$FORUM_URL" | grep -oP '^https?://[^/]+')

          echo "discussion_id=$DISCUSSION_ID" >> $GITHUB_OUTPUT
          echo "flarum_url=$FLARUM_URL" >> $GITHUB_OUTPUT
          echo "Found discussion ID: $DISCUSSION_ID"
          echo "Flarum site: $FLARUM_URL"

      - name: Send Release Notification to Flarum
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST ${{ steps.flarum-info.outputs.flarum_url }}/api/fof/releases/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Token ${{ secrets.FLARUM_API_TOKEN }}" \
            -d @- <<EOF
          {
            "discussion_id": ${{ steps.flarum-info.outputs.discussion_id }},
            "changelog": $(echo '${{ github.event.release.body }}' | jq -R -s .),
            "tag_name": "${{ github.event.release.tag_name }}",
            "release_url": "${{ github.event.release.html_url }}",
            "repository_name": "${{ github.repository }}",
            "author": "${{ github.event.release.author.login }}"
          }
          EOF
          )

          # Extract HTTP status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response body: $BODY"
          echo "HTTP status: $HTTP_CODE"

          # Check if request was successful
          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✓ Successfully posted release notification to Flarum"
          else
            echo "✗ Failed to post release notification (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Troubleshooting Info
        if: failure()
        run: |
          echo "Failed to send release notification to Flarum"
          echo ""
          echo "Please check:"
          echo "  - FLARUM_API_TOKEN secret is set correctly"
          echo "  - composer.json has 'support.forum' field with valid Flarum discussion URL"
          echo "  - The discussion exists and is not deleted"
          echo "  - The API token user has permission to post in the discussion"
          echo "  - The FoF Extension Releases extension is installed and enabled"
