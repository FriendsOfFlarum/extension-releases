# Example GitHub Actions workflow for notifying Flarum about new releases
#
# To use:
# 1. Copy to `.github/workflows/flarum-release-notification.yml`
# 2. Add secret: FLARUM_EXTENSION_UPDATES_API_TOKEN (your Flarum API token)
# 3. Set support.forum in composer.json: "support": { "forum": "https://discuss.flarum.org/d/12345" }
#
# See README.md for setup instructions

name: Notify Flarum on Release

on:
  release:
    types: [published]

jobs:
  notify-flarum:
    uses: FriendsOfFlarum/extension-releases/.github/workflows/REUSABLE_flarum-release-notification.yml@2.x
    with:
      changelog: ${{ github.event.release.body || '' }}
      tag_name: ${{ github.event.release.tag_name }}
      release_url: ${{ github.event.release.html_url }}
      author: ${{ github.event.release.author.login || github.actor || '' }}
      ref: ${{ github.ref }}
    secrets:
      flarum_api_token: ${{ secrets.FLARUM_EXTENSION_UPDATES_API_TOKEN }}
