# Reusable workflow for posting release notifications to Flarum
#
# Extracts discussion_id and flarum_url from composer.json (support.forum).
# Call from your extension's workflow on release published.
#
# Example usage:
#   jobs:
#     notify:
#       uses: FriendsOfFlarum/extension-releases/.github/workflows/REUSABLE_flarum-release-notification.yml@2.x
#       with:
#         changelog: ${{ github.event.release.body || '' }}
#         tag_name: ${{ github.event.release.tag_name }}
#         release_url: ${{ github.event.release.html_url }}
#         author: ${{ github.event.release.author.login || github.actor || '' }}
#         # flarum_hostname: optional override (default: from composer.json support.forum)
#       secrets:
#         flarum_api_token: ${{ secrets.FLARUM_EXTENSION_UPDATES_API_TOKEN }}

name: Flarum Release Notification

on:
  workflow_call:
    inputs:
      changelog:
        description: "Release changelog/notes"
        type: string
        required: true
      tag_name:
        description: "Release tag name"
        type: string
        required: true
      release_url:
        description: "URL to the release page"
        type: string
        required: false
        default: ""
      author:
        description: "Release author username"
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref to checkout (e.g. github.ref for release tag)"
        type: string
        required: false
        default: ""
      flarum_hostname:
        description: "Forum hostname override (e.g. custom-forum.com). Defaults to hostname from composer.json support.forum"
        type: string
        required: false
        default: ""
      flarum_version:
        description: "Flarum version constraint override. Defaults to require[flarum/core] from composer.json"
        type: string
        required: false
        default: ""
    secrets:
      flarum_api_token:
        description: "Flarum API token for authentication"
        required: true

jobs:
  notify-flarum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Extract Flarum info from composer.json
        id: flarum
        env:
          FLARUM_HOSTNAME_INPUT: ${{ inputs.flarum_hostname }}
          FLARUM_VERSION_INPUT: ${{ inputs.flarum_version }}
        run: |
          FORUM_URL=$(jq -r '.support.forum // empty' composer.json)

          if [ -n "$FLARUM_HOSTNAME_INPUT" ]; then
            HOSTNAME=$(echo "$FLARUM_HOSTNAME_INPUT" | sed -n 's|^https\?://||p')
            [ -z "$HOSTNAME" ] && HOSTNAME="$FLARUM_HOSTNAME_INPUT"
            FLARUM_URL="https://$HOSTNAME"
          else
            FLARUM_URL=$(echo "$FORUM_URL" | sed -n 's|^\(https\?://[^/]*\).*|\1|p')
          fi

          DISCUSSION_ID=$(echo "$FORUM_URL" | sed -n 's|.*/d/\([0-9]*\).*|\1|p')

          if [ -z "$FORUM_URL" ] || [ -z "$DISCUSSION_ID" ]; then
            echo "Error: composer.json must have support.forum with a valid discussion URL. Add: \"support\": { \"forum\": \"https://discuss.flarum.org/d/12345\" }"
            exit 1
          fi
          if [ -z "$FLARUM_URL" ]; then
            echo "Error: Could not extract forum URL from support.forum"
            exit 1
          fi

          if [ -n "$FLARUM_VERSION_INPUT" ]; then
            FLARUM_VERSION="$FLARUM_VERSION_INPUT"
          else
            FLARUM_VERSION=$(jq -r '.require["flarum/core"] // empty' composer.json)
          fi

          echo "discussion_id=$DISCUSSION_ID" >> $GITHUB_OUTPUT
          echo "flarum_url=$FLARUM_URL" >> $GITHUB_OUTPUT
          echo "flarum_version=$FLARUM_VERSION" >> $GITHUB_OUTPUT

      - name: Send Release Notification to Flarum
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          CHANGELOG_JSON=$(printf '%s' "$CHANGELOG_INPUT" | jq -R -s .)
          BODY=$(jq -n \
            --arg discussion_id '${{ steps.flarum.outputs.discussion_id }}' \
            --argjson changelog "$CHANGELOG_JSON" \
            --arg tag_name '${{ inputs.tag_name }}' \
            --arg release_url '${{ inputs.release_url }}' \
            --arg author '${{ inputs.author }}' \
            --arg flarum_version '${{ steps.flarum.outputs.flarum_version }}' \
            '{discussion_id: ($discussion_id | tonumber), changelog: $changelog, tag_name: $tag_name, release_url: $release_url, author: $author, flarum_version: $flarum_version}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST ${{ steps.flarum.outputs.flarum_url }}/api/fof/releases/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Token ${{ secrets.flarum_api_token }}" \
            -d "$BODY")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response body: $RESPONSE_BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✓ Successfully posted release notification to Flarum"
          else
            echo "✗ Failed to post release notification (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi

      - name: Troubleshooting Info
        if: failure()
        run: |
          echo "Failed to send release notification to Flarum"
          echo ""
          echo "Please check:"
          echo "  - FLARUM_EXTENSION_UPDATES_API_TOKEN secret is set correctly"
          echo "  - composer.json has 'support.forum' field with valid Flarum discussion URL"
          echo "  - The discussion exists and is not deleted"
          echo "  - The API token user has permission to post in the discussion"
          echo "  - The FoF Extension Releases extension is installed and enabled"
