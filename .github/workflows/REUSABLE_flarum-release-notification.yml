# Reusable workflow for posting release notifications to Flarum
#
# Call this from your extension's workflow (e.g. on release published).
# Requires FLARUM_API_TOKEN secret to be passed through.
#
# Example usage:
#   jobs:
#     notify:
#       uses: FriendsOfFlarum/extension-releases/.github/workflows/REUSABLE_flarum-release-notification.yml@2.x
#       with:
#         flarum_url: ${{ steps.flarum-info.outputs.flarum_url }}
#         discussion_id: ${{ steps.flarum-info.outputs.discussion_id }}
#         changelog: ${{ github.event.release.body || '' }}
#         tag_name: ${{ github.event.release.tag_name }}
#         release_url: ${{ github.event.release.html_url }}
#         author: ${{ github.event.release.author.login || github.actor || '' }}
#       secrets:
#         flarum_api_token: ${{ secrets.FLARUM_API_TOKEN }}

name: Flarum Release Notification

on:
  workflow_call:
    inputs:
      flarum_url:
        description: "Base URL of the Flarum forum (e.g. https://discuss.flarum.org)"
        type: string
        required: true
      discussion_id:
        description: "Discussion ID to post to"
        type: string
        required: true
      changelog:
        description: "Release changelog/notes"
        type: string
        required: true
      tag_name:
        description: "Release tag name"
        type: string
        required: true
      release_url:
        description: "URL to the release page"
        type: string
        required: false
        default: ""
      author:
        description: "Release author username"
        type: string
        required: false
        default: ""
    secrets:
      flarum_api_token:
        description: "Flarum API token for authentication"
        required: true

jobs:
  notify-flarum:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Notification to Flarum
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          # Build JSON body with proper escaping (changelog can contain newlines, quotes, etc.)
          CHANGELOG_JSON=$(printf '%s' "$CHANGELOG_INPUT" | jq -R -s .)
          BODY=$(jq -n \
            --argjson discussion_id '${{ inputs.discussion_id }}' \
            --argjson changelog "$CHANGELOG_JSON" \
            --arg tag_name '${{ inputs.tag_name }}' \
            --arg release_url '${{ inputs.release_url }}' \
            --arg author '${{ inputs.author }}' \
            '{discussion_id: $discussion_id, changelog: $changelog, tag_name: $tag_name, release_url: $release_url, author: $author}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST ${{ inputs.flarum_url }}/api/fof/releases/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Token ${{ secrets.flarum_api_token }}" \
            -d "$BODY")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response body: $RESPONSE_BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 201 ]; then
            echo "✓ Successfully posted release notification to Flarum"
          else
            echo "✗ Failed to post release notification (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi

      - name: Troubleshooting Info
        if: failure()
        run: |
          echo "Failed to send release notification to Flarum"
          echo ""
          echo "Please check:"
          echo "  - FLARUM_API_TOKEN secret is set correctly"
          echo "  - composer.json has 'support.forum' field with valid Flarum discussion URL"
          echo "  - The discussion exists and is not deleted"
          echo "  - The API token user has permission to post in the discussion"
          echo "  - The FoF Extension Releases extension is installed and enabled"
