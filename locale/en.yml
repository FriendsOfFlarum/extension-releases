fof-releases:
  # For more details on the format
  # Checkout https://docs.flarum.org/2.x/extend/i18n/#appendix-a-standard-key-format
  admin:
    settings:
      title: Extension Releases Settings
      username_mappings_label: Username Mappings
      username_mappings_help: "Map GitHub/GitLab usernames to Flarum usernames. When a release author matches a platform username, they will be shown as @ForumUsername (a mention)."
      platform_username_placeholder: "GitHub/GitLab username"
      forum_username_placeholder: "Forum username"
      add_mapping_button: "Add mapping"
    permissions:
      publish_release_updates_label: Publish release updates via webhook

  forum:
    post:
      header: "🚀 **Version {version}** has been released!"
      header_with_author: "🚀 **Version {version}** has been released by {author}!"
      changelog_heading: "What's Changed"
      view_release: "[**View full release →**]({url})"
      repository: "**Repository:** {name}"
